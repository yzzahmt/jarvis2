[project]
name = "jarvis-backend"
version = "0.1.0"
description = "Jarvis local assistant backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "sounddevice>=0.5",
    "numpy>=1.26,<2.1",
    "openwakeword>=0.6",
    "onnxruntime>=1.19",
    "mlx-whisper>=0.4",
    "piper-tts>=1.2",
    "ollama>=0.4",
    "ddgs>=9.0",
    "yt-dlp>=2024.10.7",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "playwright>=1.48",
    "mediapipe==0.10.14",  # newer builds (1.x) crash on macOS Metal init — pinned
    "opencv-python>=4.10",
    "pyautogui>=0.9.54",
    "webrtcvad>=2.0.10",
    "setuptools<81",  # webrtcvad still imports pkg_resources at runtime; newer setuptools dropped it
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]
