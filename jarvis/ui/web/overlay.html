<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>JARVIS çubuk</title>
<style>
/* HUD teması: koyu cam, camgöbeği ışık, ark reaktörü küre */
:root {
  --bg: rgba(6, 12, 22, 0.86); --text: #e6f6ff; --dim: #7fa3b8; --line: rgba(0, 229, 255, .22);
  --cy: #00e5ff; --cy2: #4d7cff; --mg: #c04dff; --ok: #3dffa8; --bad: #ff4d6a; --warn: #ffb547;
  --btn: rgba(0, 229, 255, .07); --btn-h: rgba(0, 229, 255, .16);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: transparent; overflow: hidden; }
body { font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; color: var(--text);
  -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; display: grid; place-items: center; }
.mono { font-family: "SF Mono", ui-monospace, Menlo, monospace; }

.pill { position: relative; width: calc(100% - 20px); height: calc(100% - 20px); border-radius: 18px; padding: 1px;
  background: var(--line); box-shadow: 0 14px 44px rgba(0,0,0,.6), 0 0 22px rgba(0,229,255,.12);
  animation: in .5s cubic-bezier(.2,.9,.2,1.1); overflow: hidden; }
.pill::before { content: ""; position: absolute; inset: -80%; opacity: 0; transition: opacity .5s;
  background: conic-gradient(from 0deg, transparent 0 60%, var(--cy) 72%, var(--cy2) 80%, var(--mg) 88%, transparent 96%);
  animation: rot 3.2s linear infinite; }
body[data-state="listening"] .pill::before, body[data-state="speaking"] .pill::before,
body[data-state="thinking"] .pill::before, body.busy .pill::before { opacity: 1; }
body[data-state="thinking"] .pill::before, body.busy .pill::before { animation-duration: 1.4s; }
body.muted .pill { background: rgba(255, 77, 106, .35); }
.in { position: relative; height: 100%; border-radius: 17px; background: var(--bg);
  -webkit-backdrop-filter: blur(30px) saturate(1.6); backdrop-filter: blur(30px) saturate(1.6);
  display: flex; align-items: center; gap: 12px; padding: 0 10px 0 12px; overflow: hidden; }
.in::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background: repeating-linear-gradient(0deg, rgba(0,229,255,.035) 0 1px, transparent 1px 3px); }
@keyframes in { from { transform: translateY(18px) scale(.96); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes rot { to { transform: rotate(360deg) } }

/* ark reaktörü */
.orb { position: relative; width: 44px; height: 44px; flex-shrink: 0; transition: transform .5s, filter .5s; }
.orb .r { position: absolute; border-radius: 50%; border: 1.5px solid transparent; }
.orb .r1 { inset: 0; border-color: var(--cy) transparent var(--cy) transparent; animation: rot 4s linear infinite; opacity: .8; }
.orb .r2 { inset: 6px; border: 1px dashed rgba(0,229,255,.55); animation: rot 9s linear infinite reverse; }
.orb .r3 { inset: 11px; border-color: transparent var(--mg) transparent var(--cy2); animation: rot 2.6s linear infinite; }
.orb .core { position: absolute; inset: 16px; border-radius: 50%; background: radial-gradient(circle, #fff, var(--cy) 45%, transparent 75%);
  box-shadow: 0 0 14px var(--cy), 0 0 28px rgba(0,229,255,.45); animation: breathe 3.6s ease-in-out infinite; }
body[data-state="sleep"] .orb { transform: scale(.85); filter: saturate(.2) brightness(.7); }
body[data-state="listening"] .orb { animation: pulse 1.3s ease-in-out infinite; }
body[data-state="thinking"] .orb .r, body.busy .orb .r { animation-duration: 1.1s; }
body[data-state="speaking"] .orb { animation: talk .7s ease-in-out infinite; }
body.muted .orb { filter: hue-rotate(150deg) saturate(1.4); }
@keyframes breathe { 0%,100% { transform: scale(.85); opacity: .75 } 50% { transform: scale(1.12); opacity: 1 } }
@keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.1) } }
@keyframes talk { 0%,100% { transform: scale(1) } 30% { transform: scale(1.07) } 65% { transform: scale(.96) } }

.txt { min-width: 0; flex: 1; position: relative; z-index: 1; }
.title { display: flex; align-items: center; gap: 8px; font-size: 10.5px; font-weight: 600; letter-spacing: .18em;
  color: var(--cy); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-shadow: 0 0 8px rgba(0,229,255,.5); }
.title span:first-child { overflow: hidden; text-overflow: ellipsis; }
.sub { margin-top: 3px; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .3s; }
body.ok .sub { color: var(--ok); } body.fail .sub { color: var(--bad); }
.wave { display: none; gap: 2px; align-items: center; height: 12px; }
.wave s { width: 2.5px; height: 4px; border-radius: 1px; background: var(--cy); box-shadow: 0 0 6px var(--cy); animation: w .9s ease-in-out infinite; }
.wave s:nth-child(2) { animation-delay: -.7s } .wave s:nth-child(3) { animation-delay: -.45s }
.wave s:nth-child(4) { animation-delay: -.2s } .wave s:nth-child(5) { animation-delay: -.55s }
body[data-state="listening"] .wave, body[data-state="speaking"] .wave { display: inline-flex; }
@keyframes w { 0%,100% { height: 3px } 50% { height: 12px } }

.btns { display: none; gap: 6px; align-items: center; position: relative; z-index: 1; }
body.dock .btns { display: flex; }
.b { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); display: grid; place-items: center; cursor: default;
  background: var(--btn); color: var(--text); transition: background .2s, transform .15s, box-shadow .2s; }
.b:hover { background: var(--btn-h); box-shadow: 0 0 12px rgba(0,229,255,.25); } .b:active { transform: scale(.9); }
.b svg { width: 16px; height: 16px; }
.b.mic { background: linear-gradient(135deg, rgba(0,229,255,.35), rgba(77,124,255,.35)); border-color: var(--cy);
  box-shadow: 0 0 14px rgba(0,229,255,.35); }
body[data-state="listening"] .b.mic { animation: pulse 1.2s ease-in-out infinite; }
.b.mute .off { display: none; }
body.muted .b.mute { color: var(--bad); border-color: var(--bad); background: rgba(255,77,106,.14); box-shadow: 0 0 12px rgba(255,77,106,.35); }
body.muted .b.mute .on { display: none; } body.muted .b.mute .off { display: block; }
.b.stop { color: var(--bad); display: none; } body.busy .b.stop { display: grid; }
.b.x { width: 24px; height: 24px; background: transparent; border: 0; color: var(--dim); }
.b.x svg { width: 12px; height: 12px; }

.bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 40%; display: none;
  background: linear-gradient(90deg, transparent, var(--cy), var(--mg), transparent); animation: slide 1.6s ease-in-out infinite; }
body.busy .bar { display: block; }
@keyframes slide { from { transform: translateX(-100%) } to { transform: translateX(260%) } }
</style>
</head>
<body data-state="idle">
<div class="pill"><div class="in">
  <div class="orb"><i class="r r1"></i><i class="r r2"></i><i class="r r3"></i><i class="core"></i></div>
  <div class="txt">
    <div class="title mono"><span id="title">JARVIS</span><span class="wave"><s></s><s></s><s></s><s></s><s></s></span></div>
    <div class="sub" id="sub"></div>
  </div>
  <div class="btns">
    <button class="b stop" title="Durdur" onclick="api('stop')"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg></button>
    <button class="b mute" id="mute" title="Mikrofonu kapat" onclick="mute()">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.7-1.3M19 11a7 7 0 0 1-1.1 3.8M5 11a7 7 0 0 0 11 5.7M12 18v3"/></svg>
    </button>
    <button class="b mic" title="Konuş" onclick="api('mic')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h2M8 8v8M12 5v14M16 8v8M20 12h0"/></svg></button>
    <button class="b" title="Büyüt" onclick="api('expand')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></button>
    <button class="b x" title="Gizle (kısayol geri getirir)" onclick="api('close')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="bar"></div>
</div></div>
<script>
const $ = id => document.getElementById(id), B = document.body;
const LABEL = { idle: "Jarvis · hazır", sleep: "Uykuda", listening: "Dinliyorum", thinking: "İşleniyor", speaking: "Konuşuyor" };
const HINT = { idle: "Bir şey söyle ya da dokun", sleep: "“Hey Jarvis” de ya da alkışla", listening: "Seni dinliyorum…" };
let state = "idle", last = "";
function api(n) { return window.pywebview && window.pywebview.api[n](); }
async function mute() { const r = await api("mute"); if (r != null) setMuted(r); }
function setMuted(on) { B.classList.toggle("muted", on); $("mute").title = on ? "Mikrofonu aç" : "Mikrofonu kapat"; if (!B.classList.contains("busy")) idleView(); }
function replay() { const p = document.querySelector(".pill"); p.style.animation = "none"; p.offsetHeight; p.style.animation = ""; }
function idleView() {
  B.classList.remove("busy", "end", "ok", "fail");
  const muted = B.classList.contains("muted");
  $("title").textContent = muted ? "Mikrofon kapalı" : (LABEL[state] || "Jarvis");
  $("sub").textContent = muted ? "Dinlemiyorum · açmak için mikrofona dokun" : state === "listening" || !last ? (HINT[state] || last) : last;
}
window.bar = {
  on(m) {
    if (m.t === "dock") { B.classList.add("dock"); if (m.state) state = m.state; if (m.text) last = m.text; B.dataset.state = state; idleView(); replay(); }
    else if (m.t === "hide") B.classList.remove("dock");
    else if (m.t === "muted") setMuted(m.on);
    else if (m.t === "state") { state = m.state; B.dataset.state = state; if (!B.classList.contains("busy")) idleView(); }
    else if (m.t === "msg") { last = m.text; if (!B.classList.contains("busy")) $("sub").textContent = m.role === "user" ? "“" + m.text + "”" : m.text; }
    else if (m.t === "show") {
      B.classList.remove("end", "ok", "fail"); B.classList.add("busy");
      $("title").textContent = m.title || "JARVIS"; $("sub").textContent = m.text || ""; replay();
    }
    else if (m.t === "step") { B.classList.add("busy"); $("sub").textContent = m.text; }
    else if (m.t === "done") { B.classList.remove("busy"); B.classList.add("end", m.ok ? "ok" : "fail"); $("sub").textContent = (m.ok ? "✓ " : "✕ ") + (m.text || ""); }
  }
};
</script>
</body>
</html>
