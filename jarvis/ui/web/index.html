<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<style>
/* HUD teması: koyu cam, camgöbeği ışık, ark reaktörü */
:root {
  --glass: rgba(5, 10, 20, 0.88);
  --card: rgba(0, 229, 255, 0.055);
  --line: rgba(0, 229, 255, 0.16);
  --text: #e6f6ff;
  --dim: #8fb0c4;
  --faint: #4f6c80;
  --accent: #00e5ff;
  --accent2: #4d7cff;
  --mg: #c04dff;
  --ok: #3dffa8;
  --bad: #ff4d6a;
  --warn: #ffb547;
  --field: rgba(0, 229, 255, 0.06);
  --sheet: rgba(4, 9, 18, 0.97);
  --sel: rgba(0, 229, 255, 0.12);
  --mono: "SF Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: transparent; overflow: hidden; }
body {
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  color: var(--text); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none;
}
.shell {
  position: absolute; inset: 0; border-radius: 20px; overflow: hidden;
  background: radial-gradient(120% 70% at 50% 0%, rgba(0,90,140,.35), transparent 60%), var(--glass);
  border: 1px solid var(--line); display: flex; flex-direction: column;
}
/* ızgara + tarama çizgileri */
.shell::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background:
    linear-gradient(rgba(0,229,255,.05) 1px, transparent 1px) 0 0 / 28px 28px,
    linear-gradient(90deg, rgba(0,229,255,.05) 1px, transparent 1px) 0 0 / 28px 28px;
  -webkit-mask-image: radial-gradient(90% 60% at 50% 22%, #000, transparent 75%); }
.shell::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px); }
/* HUD köşe çerçeveleri */
.corner { position: absolute; width: 18px; height: 18px; border: 2px solid var(--accent); opacity: .55; pointer-events: none; z-index: 6;
  transition: opacity .4s, filter .4s; }
.corner.tl { top: 8px; left: 8px; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; }
.corner.tr { top: 8px; right: 8px; border-left: 0; border-bottom: 0; border-top-right-radius: 8px; }
.corner.bl { bottom: 8px; left: 8px; border-right: 0; border-top: 0; border-bottom-left-radius: 8px; }
.corner.br { bottom: 8px; right: 8px; border-left: 0; border-top: 0; border-bottom-right-radius: 8px; }
body[data-state="listening"] .corner, body[data-state="speaking"] .corner, body.busy .corner { opacity: 1; filter: drop-shadow(0 0 5px var(--accent)); }
body.muted .corner { border-color: var(--bad); }

/* başlık */
header { height: 46px; display: flex; align-items: center; padding: 0 16px; gap: 8px; flex-shrink: 0; position: relative; z-index: 2; }
.lights { display: flex; gap: 8px; }
.lights button { width: 12px; height: 12px; border-radius: 50%; border: 0; cursor: default; opacity: .75; }
.lights .c { background: #ff5f57; } .lights .m { background: #febc2e; }
.lights:hover button { opacity: 1; }
.brand { flex: 1; text-align: center; font: 600 12px var(--mono); letter-spacing: .5em; margin-left: 32px; color: var(--accent);
  text-shadow: 0 0 10px rgba(0,229,255,.6); }
.icon-btn { width: 28px; height: 28px; border-radius: 8px; border: 1px solid transparent; background: transparent; color: var(--dim);
  display: grid; place-items: center; cursor: default; transition: .2s; }
.icon-btn:hover { background: var(--field); color: var(--accent); border-color: var(--line); }
.icon-btn svg { width: 16px; height: 16px; }

/* ark reaktörü */
.hero { display: flex; flex-direction: column; align-items: center; padding: 4px 0 12px; flex-shrink: 0; transition: padding .5s; position: relative; z-index: 1; }
.orb { position: relative; width: 156px; height: 156px; transition: transform .6s cubic-bezier(.2,.8,.2,1), width .5s, height .5s, filter .5s; }
.orb .ring { position: absolute; border-radius: 50%; border: 2px solid transparent; }
.orb .r1 { inset: 0; border-color: rgba(0,229,255,.9) transparent rgba(0,229,255,.9) transparent; animation: spin 7s linear infinite;
  filter: drop-shadow(0 0 6px var(--accent)); }
.orb .r2 { inset: 9%; border: 1px dashed rgba(0,229,255,.5); animation: spin 18s linear infinite reverse; }
.orb .r3 { inset: 17%; border-width: 3px; border-color: transparent var(--mg) transparent var(--accent2); animation: spin 4.5s linear infinite; opacity: .85; }
.orb .r4 { inset: 26%; border: 1px solid rgba(0,229,255,.35);
  background: repeating-conic-gradient(rgba(0,229,255,.55) 0 4deg, transparent 4deg 30deg);
  -webkit-mask: radial-gradient(circle, transparent 58%, #000 60%); animation: spin 11s linear infinite reverse; }
.orb .core { position: absolute; inset: 35%; border-radius: 50%;
  background: radial-gradient(circle, #fff 0, #bff8ff 22%, var(--accent) 48%, rgba(0,229,255,.15) 70%, transparent 74%);
  box-shadow: 0 0 30px var(--accent), 0 0 70px rgba(0,229,255,.45); animation: breathe 3.8s ease-in-out infinite; }
.orb .glow { position: absolute; inset: -18%; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,229,255,.22), transparent);
  pointer-events: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 0%,100% { transform: scale(.9); opacity: .82 } 50% { transform: scale(1.06); opacity: 1 } }
@keyframes pulse { 0%,100% { transform: scale(1) } 50% { transform: scale(1.07) } }
@keyframes talk { 0%,100% { transform: scale(1) } 25% { transform: scale(1.05) } 60% { transform: scale(.97) } }

body[data-state="sleep"] .orb { transform: scale(.74); filter: saturate(.15) brightness(.65); }
body[data-state="sleep"] .orb .ring { animation-duration: 40s; }
body[data-state="listening"] .orb { animation: pulse 1.5s ease-in-out infinite; }
body[data-state="thinking"] .orb .ring, body.busy .orb .ring { animation-duration: 1.4s; }
body[data-state="thinking"] .orb .core { animation-duration: 1s; }
body[data-state="speaking"] .orb { animation: talk .7s ease-in-out infinite; }
body.muted .orb { filter: hue-rotate(155deg) saturate(1.3) brightness(.85); }
body.compact .orb { width: 76px; height: 76px; }
body.compact .hero { padding: 0 0 6px; }

.status { margin-top: 12px; font: 500 11.5px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent);
  height: 18px; display: flex; align-items: center; gap: 8px; text-shadow: 0 0 8px rgba(0,229,255,.45); max-width: 92%; }
#status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
body.muted .status { color: var(--bad); text-shadow: none; }
.wave { display: none; gap: 2px; align-items: center; height: 14px; }
.wave s { width: 3px; height: 4px; border-radius: 1px; background: var(--accent); box-shadow: 0 0 6px var(--accent); animation: wv .9s ease-in-out infinite; }
.wave s:nth-child(2) { animation-delay: -.7s } .wave s:nth-child(3) { animation-delay: -.45s }
.wave s:nth-child(4) { animation-delay: -.2s } .wave s:nth-child(5) { animation-delay: -.55s }
body[data-state="listening"] .wave, body[data-state="speaking"] .wave { display: inline-flex; }
@keyframes wv { 0%,100% { height: 3px } 50% { height: 14px } }
.machines { display: flex; gap: 6px; margin-top: 10px; }
.chip { display: flex; align-items: center; gap: 6px; font: 11px var(--mono); letter-spacing: .06em; color: var(--dim); padding: 3px 10px;
  border-radius: 6px; background: var(--field); border: 1px solid var(--line); }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.chip.on i { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.chip.down i { background: var(--bad); }
.chip.active { color: var(--text); border-color: var(--accent); box-shadow: 0 0 10px rgba(0,229,255,.25); }

/* sohbet */
.feed { flex: 1; overflow-y: auto; padding: 4px 18px 12px; display: flex; flex-direction: column; gap: 10px; position: relative; z-index: 1;
  mask-image: linear-gradient(to bottom, transparent, #000 18px); scrollbar-width: none; }
.feed::-webkit-scrollbar { display: none; }
.empty { margin: auto; text-align: center; color: var(--faint); font-size: 13px; line-height: 1.7; }
.empty b { color: var(--text); font-weight: 600; font-size: 15px; }
.m { max-width: 88%; animation: rise .35s cubic-bezier(.2,.8,.2,1); user-select: text; -webkit-user-select: text; }
.m.user { align-self: flex-end; color: var(--text); padding: 7px 12px; border-radius: 12px 12px 3px 12px;
  background: linear-gradient(135deg, rgba(0,229,255,.22), rgba(77,124,255,.22)); border: 1px solid rgba(0,229,255,.35);
  box-shadow: 0 0 14px rgba(0,229,255,.12); }
.m.jarvis { align-self: flex-start; font-size: 14.5px; display: flex; gap: 10px; align-items: flex-start; position: relative; max-width: 94%; }
.m.jarvis .av { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; border: 1.5px solid var(--accent);
  background: radial-gradient(circle, #fff 0, var(--accent) 35%, transparent 60%); box-shadow: 0 0 10px rgba(0,229,255,.6); }
.m.jarvis .tx { background: var(--card); padding: 8px 12px; border-radius: 3px 12px 12px 12px; border: 1px solid var(--line);
  border-left: 2px solid var(--accent); }
.m.jarvis .cp { position: absolute; right: -30px; top: 4px; width: 24px; height: 24px; border: 0; border-radius: 7px; background: var(--field);
  color: var(--dim); display: grid; place-items: center; opacity: 0; transition: opacity .2s; cursor: default; }
.m.jarvis:hover .cp { opacity: 1; } .m.jarvis .cp svg { width: 12px; height: 12px; }
.m.interim { align-self: flex-start; color: var(--dim); font-size: 13px; font-style: italic; }
@keyframes rise { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }

.task { align-self: stretch; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; animation: rise .35s;
  position: relative; overflow: hidden; }
.task::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 40%;
  background: linear-gradient(90deg, transparent, var(--accent), var(--mg), transparent); animation: slide 1.6s ease-in-out infinite; }
.task.done::after, .task.fail::after { display: none; }
@keyframes slide { from { transform: translateX(-100%) } to { transform: translateX(260%) } }
.task .t { display: flex; align-items: center; gap: 8px; font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
.task .t .sp { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent);
  animation: spin .8s linear infinite; }
.task.done .t .sp { animation: none; border-color: var(--ok); background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.task.fail .t .sp { animation: none; border-color: var(--bad); background: var(--bad); }
.task .steps { margin-top: 7px; display: flex; flex-direction: column; gap: 3px; border-left: 1px solid var(--line); padding-left: 10px; }
.task .s { font-size: 12.5px; color: var(--dim); display: flex; gap: 7px; align-items: baseline; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; }
.task .s::before { content: "›"; color: var(--faint); flex-shrink: 0; font-family: var(--mono); }
.task .s.cur { color: var(--text); }
.task .s.cur::before { color: var(--accent); text-shadow: 0 0 6px var(--accent); }

.ask { align-self: stretch; border-radius: 12px; padding: 12px; background: rgba(255,181,71,.06);
  border: 1px solid var(--warn); animation: rise .3s; }
.ask p { font-size: 13.5px; margin-bottom: 10px; word-break: break-word; }
.ask .row { display: flex; gap: 8px; }
.ask button { flex: 1; height: 32px; border-radius: 8px; border: 1px solid var(--line); font: inherit; font-weight: 600; cursor: default; }
.ask .yes { background: var(--accent); color: #001018; border-color: var(--accent); box-shadow: 0 0 12px rgba(0,229,255,.35); }
.ask .no { background: var(--field); color: var(--text); }
.ask.closed { opacity: .45; }
.ask.closed .row { display: none; }

/* giriş */
footer { position: relative; z-index: 1; }
.composer { padding: 10px 16px 14px; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
.field { flex: 1; display: flex; align-items: center; background: var(--field); border-radius: 12px; height: 42px; padding: 0 6px 0 14px;
  border: 1px solid var(--line); transition: box-shadow .25s, border-color .25s; }
.field::before { content: "›"; color: var(--accent); font: 600 16px var(--mono); margin-right: 8px; }
.field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,229,255,.12), 0 0 18px rgba(0,229,255,.18); }
.field input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-size: 14px; caret-color: var(--accent); }
.field input::placeholder { color: var(--faint); }
.send { width: 30px; height: 30px; border-radius: 8px; border: 0; background: var(--accent); color: #001018; display: grid; place-items: center;
  opacity: 0; transform: scale(.6); transition: .2s; cursor: default; box-shadow: 0 0 12px rgba(0,229,255,.5); }
.send.show { opacity: 1; transform: none; }
.send svg { width: 14px; height: 14px; }
.round { width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line); display: grid; place-items: center; cursor: default;
  transition: transform .15s, box-shadow .2s, background .2s; background: var(--field); color: var(--text); }
.round:hover { box-shadow: 0 0 12px rgba(0,229,255,.25); }
.round:active { transform: scale(.92); }
.round svg { width: 18px; height: 18px; }
.mic { background: linear-gradient(135deg, rgba(0,229,255,.4), rgba(77,124,255,.4)); border-color: var(--accent); color: #fff;
  box-shadow: 0 0 16px rgba(0,229,255,.35); }
.mic.off { background: var(--field); color: var(--faint); box-shadow: none; border-color: var(--line); }
body[data-state="listening"] .mic { animation: pulse 1.2s ease-in-out infinite; }
.mute .off { display: none; }
body.muted .mute { color: var(--bad); border-color: var(--bad); background: rgba(255,77,106,.12); box-shadow: 0 0 14px rgba(255,77,106,.3); }
body.muted .mute .on { display: none; } body.muted .mute .off { display: block; }
.stopb { color: var(--bad); display: none; }
body.busy .stopb { display: grid; }
.hint { text-align: center; font: 10.5px var(--mono); letter-spacing: .08em; color: var(--faint); padding-bottom: 12px; margin-top: -6px; }

/* örnek komutlar */
.sugs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px; }
.sug { font: inherit; font-size: 12.5px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card);
  color: var(--text); cursor: default; transition: transform .15s, border-color .2s, box-shadow .2s; }
.sug:hover { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,229,255,.2); } .sug:active { transform: scale(.95); }

/* uyarı şeridi */
.banner { align-self: stretch; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px;
  background: rgba(0,229,255,.08); border: 1px solid var(--line); font-size: 12.5px; cursor: default; }
.banner b { font-weight: 600; } .banner span { flex: 1; color: var(--dim); } .banner .go { color: var(--accent); font-weight: 600; }

/* ödeme onayı */
.ask.pay { border-color: var(--bad); background: rgba(255,77,106,.06); }
.ask.pay .yes { background: var(--bad); border-color: var(--bad); color: #fff; box-shadow: 0 0 12px rgba(255,77,106,.4); }
.ask .tag { display: inline-block; font: 700 10.5px var(--mono); letter-spacing: .12em; color: var(--bad); margin-bottom: 6px; }

/* küçük pencere (kısayol) */
body.mini .shell { border-radius: 16px; }
body.mini header { height: 34px; }
body.mini .brand { font-size: 11px; }
body.mini .hero, body.mini .hint, body.mini #banner, body.mini .sugs, body.mini .sheet, body.mini .corner { display: none; }
body.mini .feed { padding-top: 0; }
body.mini .feed > :not(:nth-last-child(-n+2)) { display: none; }   /* yalnız son iki mesaj */
body.mini .empty { font-size: 12px; }
.mini-only { display: none; }
body.mini .mini-only { display: grid; }
body.mini .full-only { display: none; }

/* ayarlar */
.sheet { position: absolute; inset: 46px 0 0 0; z-index: 5; background: var(--sheet); backdrop-filter: blur(40px);
  -webkit-backdrop-filter: blur(40px); transform: translateY(102%); transition: transform .38s cubic-bezier(.2,.8,.2,1);
  overflow-y: auto; padding: 4px 18px 22px; scrollbar-width: none; border-top: 1px solid var(--line); }
.sheet::-webkit-scrollbar { display: none; }
body.settings .sheet { transform: none; }
.sheet h3 { font: 600 10.5px var(--mono); letter-spacing: .2em; color: var(--accent); margin: 18px 2px 8px; }
.opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--card);
  border: 1px solid var(--line); margin-bottom: 6px; cursor: default; transition: box-shadow .2s, border-color .2s; }
.opt.sel { border-color: var(--accent); background: var(--sel); box-shadow: 0 0 12px rgba(0,229,255,.18); }
.opt .ck { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--faint); flex-shrink: 0;
  display: grid; place-items: center; transition: .2s; }
.opt.sel .ck { background: var(--accent); border-color: var(--accent); }
.opt.sel .ck::after { content: ""; width: 4px; height: 8px; border: solid #001018; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.opt .tag2 { font: 600 10.5px var(--mono); color: var(--accent); display: none; }
.opt.sel .tag2 { display: inline; }
.opt.playing .play { background: var(--accent); color: #001018; }
.brains { display: flex; flex-wrap: wrap; gap: 6px; }
.brains .bc { display: flex; align-items: center; gap: 6px; font: 11.5px var(--mono); padding: 4px 10px; border-radius: 6px;
  background: var(--card); border: 1px solid var(--line); }
.brains .bc i { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); }
.brains .bc i.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); } .brains .bc i.wait { background: var(--warn); }
.brains .bc.now { border-color: var(--accent); box-shadow: 0 0 10px rgba(0,229,255,.25); }
.opt .n { font-weight: 600; } .opt .d { color: var(--dim); font-size: 12px; flex: 1; }
.opt i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex-shrink: 0; }
.opt i.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); } .opt i.wait { background: var(--warn); }
.play { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--text);
  display: grid; place-items: center; cursor: default; }
.play svg { width: 12px; height: 12px; }
.keyrow { display: flex; gap: 8px; }
.keyrow input { flex: 1; height: 36px; border-radius: 8px; border: 1px solid var(--line); outline: 0; padding: 0 12px; background: var(--field);
  color: var(--text); font: 13px var(--mono); user-select: text; -webkit-user-select: text; }
.keyrow input:focus { border-color: var(--accent); }
.keyrow button { height: 36px; padding: 0 14px; border-radius: 8px; border: 0; background: var(--accent); color: #001018;
  font: inherit; font-weight: 700; cursor: default; }
.note { font-size: 12px; color: var(--dim); margin: 6px 2px 0; line-height: 1.5; }
.note a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body data-state="idle">
<div class="shell">
  <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
  <header class="pywebview-drag-region">
    <div class="lights">
      <button class="c" title="Kapat" onclick="api('quit')"></button>
      <button class="m" title="Alt çubuğa küçült" onclick="api('minimize')"></button>
    </div>
    <div class="brand pywebview-drag-region">JARVIS</div>
    <button class="icon-btn" id="spk" title="Yanıtları sesli oku" onclick="toggleSpeak()"></button>
    <button class="icon-btn mini-only" title="Büyüt" onclick="api('expand')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
    </button>
    <button class="icon-btn" id="gear" title="Ayarlar" onclick="toggleSettings()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <section class="sheet" id="sheet">
    <h3>SES</h3><div id="voices"></div>
    <h3>BEYİN</h3><div id="brains" class="brains"></div><p class="note" id="usage"></p>
    <h3>GEMİNİ ANAHTARI</h3>
    <div class="keyrow"><input id="key" type="password" placeholder="AIza… yapıştır" autocomplete="off" spellcheck="false"><button onclick="saveKey()">Kaydet</button></div>
    <p class="note" id="keynote">Ücretsiz: <a href="#" onclick="api('send','https://aistudio.google.com/apikey adresini aç');return false">aistudio.google.com/apikey</a>. Jarvis'i hızlandırır, ekranı görmesini sağlar. Claude tokeni harcanmaz.</p>
  </section>

  <section class="hero pywebview-drag-region">
    <div class="orb"><i class="glow"></i><i class="ring r1"></i><i class="ring r2"></i><i class="ring r3"></i><i class="ring r4"></i><i class="core"></i></div>
    <div class="status"><span class="wave"><s></s><s></s><s></s><s></s><s></s></span><span id="status">Sistem hazır</span></div>
    <div class="machines" id="machines"></div>
  </section>

  <main class="feed" id="feed">
    <div class="empty" id="empty"><b id="greet">Merhaba</b><br>Bir şey söyle ya da yaz.
      <div class="sugs">
        <button class="sug">İndirilenlerde kaç PDF var?</button>
        <button class="sug">Trendyol'da en ucuz orijinal EarPods'u bul</button>
        <button class="sug">Bugün ne yapsam, bir fikir ver</button>
        <button class="sug">Blender'da bana mavi bir araba yap</button>
        <button class="sug">Sesi 30 yap</button>
      </div>
    </div>
  </main>

  <footer>
    <div class="composer">
      <div class="field">
        <input id="inp" placeholder="JARVIS'e yaz…" autocomplete="off" spellcheck="false">
        <button class="send" id="send" title="Gönder" onclick="send()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <button class="round stopb" title="Görevi durdur" onclick="api('stop')">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2.5"/></svg>
      </button>
      <button class="round mute" id="mute" title="Mikrofonu kapat" onclick="mute()">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V6a3 3 0 0 0-5.7-1.3M19 11a7 7 0 0 1-1.1 3.8M5 11a7 7 0 0 0 11 5.7M12 18v3"/></svg>
      </button>
      <button class="round mic" id="mic" title="Konuş" onclick="mic()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h2M8 8v8M12 5v14M16 8v8M20 12h0"/></svg>
      </button>
    </div>
    <div class="hint" id="hint"></div>
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const feed = $("feed"), inp = $("inp");
const STATUS = { idle: "Sistem hazır", sleep: "Uykuda · “Hey Jarvis” de", listening: "Dinliyorum…", thinking: "İşleniyor…", speaking: "Konuşuyorum…" };
const SPK_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const SPK_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6M21 9l-5 6"/></svg>';
let speak = true, task = null, asks = {}, statusText = null;

function api(name, ...a) { return window.pywebview && window.pywebview.api[name](...a); }
function scroll() { feed.scrollTo({ top: feed.scrollHeight, behavior: "smooth" }); }
function add(el) { $("empty")?.remove(); document.body.classList.remove("settings"); feed.appendChild(el); scroll(); document.body.classList.toggle("compact", feed.children.length > 3); return el; }
function el(cls, text) { const d = document.createElement("div"); d.className = cls; if (text != null) d.textContent = text; return d; }
const COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
function jmsg(text) {
  const m = el("m jarvis"), cp = document.createElement("button");
  cp.className = "cp"; cp.title = "Kopyala"; cp.innerHTML = COPY;
  cp.onclick = () => { navigator.clipboard?.writeText(text); cp.innerHTML = "✓"; setTimeout(() => cp.innerHTML = COPY, 1200); };
  m.append(el("av"), el("tx", text), cp); return m;
}
function setState(s) {
  document.body.dataset.state = s;
  $("status").textContent = muted() && !statusText ? "Mikrofon kapalı" : statusText && s === "thinking" ? statusText : (STATUS[s] || "");
}
const muted = () => document.body.classList.contains("muted");
function setMuted(on) { document.body.classList.toggle("muted", on); $("mute").title = on ? "Mikrofonu aç" : "Mikrofonu kapat"; setState(document.body.dataset.state); hint(); }
async function mute() { const r = await api("mute"); if (r != null) setMuted(r); }

function machines(list) {
  const box = $("machines"); box.innerHTML = "";
  for (const m of list) {
    const c = el("chip " + m.state); c.dataset.id = m.id;
    c.title = { on: "Çevrimiçi", down: "Çevrimdışı", off: "Bağlantı ayarlanmadı" }[m.state];
    c.append(document.createElement("i"), m.name); box.appendChild(c);
  }
  if (task) markActive(task.machine);
}
function markActive(id) { document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c.dataset.id === id)); }

window.jarvis = {
  on(type, d) {
    if (type === "state") setState(d.state);
    else if (type === "msg") {
      if (d.role === "user") add(el("m user", d.text));
      else if (d.role === "jarvis-interim") add(el("m interim", d.text));
      else add(jmsg(d.text));
    }
    else if (type === "task_start") {
      const t = add(el("task"));
      const head = el("t"); head.append(el("sp"), d.title); t.append(head, el("steps"));
      task = { el: t, machine: d.machine }; markActive(d.machine);
      document.body.classList.add("busy"); statusText = d.title; setState("thinking");
    }
    else if (type === "step" && task) {
      const steps = task.el.querySelector(".steps");
      steps.querySelectorAll(".cur").forEach(s => s.classList.remove("cur"));
      steps.appendChild(el("s cur", d.text)); statusText = d.text; setState("thinking"); scroll();
    }
    else if (type === "task_end" && task) {
      task.el.classList.add(d.ok ? "done" : "fail");
      task.el.querySelectorAll(".cur").forEach(s => s.classList.remove("cur"));
      task = null; markActive(null); statusText = null; document.body.classList.remove("busy");
    }
    else if (type === "ask") {
      const pay = /^Ödeme adımı/.test(d.question);
      const a = add(el(pay ? "ask pay" : "ask")), p = document.createElement("p"); p.textContent = d.question;
      if (pay) a.append(el("tag", "ÖDEME ONAYI"));
      const row = el("row"), y = document.createElement("button"), n = document.createElement("button");
      y.className = "yes"; y.textContent = pay ? "Onayla ve öde" : "Evet"; y.onclick = () => answer("evet");
      n.className = "no"; n.textContent = "Hayır"; n.onclick = () => answer("hayır");
      row.append(n, y); a.append(p, row); asks[d.id] = a; inp.placeholder = "Cevabını yaz…";
    }
    else if (type === "ask_done") { asks[d.id]?.classList.add("closed"); delete asks[d.id]; inp.placeholder = "JARVIS'e yaz…"; }
    else if (type === "machines") machines(d.list);
    else if (type === "mini") { document.body.classList.toggle("mini", d.on); if (d.on) toggleSettings(false); scroll(); }
    else if (type === "focus") inp.focus();
    else if (type === "muted") setMuted(d.on);
    else if (type === "voice") { $("mic").classList.toggle("off", !d.ok); $("mic").title = d.ok ? "Dinle" : d.text; hint(); }
  }
};

function answer(t) { api("answer", t); jarvis.on("msg", { role: "user", text: t }); }
function send() { const t = inp.value.trim(); if (!t) return; inp.value = ""; $("send").classList.remove("show"); api("send", t); }
async function mic() { const r = await api("mic"); if (r) add(el("m interim", r)); }
function toggleSpeak() { speak = !speak; $("spk").innerHTML = speak ? SPK_ON : SPK_OFF; api("set_speak", speak); }
let hotkey = "cmd+shift+j";
function hint() { $("hint").textContent = $("mic").classList.contains("off") ? "Ses kapalı · yazarak kullan" : muted() ? "Mikrofon kapalı · açmak için 🎙 ya da konuş düğmesi" : `“Hey Jarvis” de ya da ${hotkey.replace(/\+/g, " ").replace("cmd", "⌘").replace("shift", "⇧")}`; }

// ---- ayarlar ----
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
async function toggleSettings(force) {
  if (force !== false && document.body.classList.contains("mini")) await api("expand");   // ayarlar büyük pencerede
  const on = force ?? !document.body.classList.contains("settings");
  document.body.classList.toggle("settings", on);
  if (on) renderSettings(await api("settings"));
}
function renderSettings(st) {
  const vs = $("voices"); vs.innerHTML = "";
  for (const v of st.voices) {
    const o = el("opt" + (v.id === st.voice ? " sel" : "")), ck = el("ck"), n = el("n", v.name), d = el("d", v.desc), b = document.createElement("button");
    const tag = el("tag2", "Seçili");
    b.className = "play"; b.innerHTML = PLAY; b.title = "Seçmeden dinle";
    b.onclick = e => { e.stopPropagation(); playing(o); api("preview_voice", v.id); };
    o.onclick = async () => {
      vs.querySelectorAll(".opt").forEach(x => x.classList.toggle("sel", x === o));   // anında göster
      playing(o); st.voice = v.id;
      if (!(await api("set_voice", v.id))) renderSettings(await api("settings"));
      api("preview_voice", v.id);
    };
    o.append(ck, n, d, tag, b); vs.appendChild(o);
  }
  const bs = $("brains"); bs.innerHTML = "";
  for (const b of st.brains) {
    const c = el("bc" + (st.active.startsWith(b.name + ":") ? " now" : "")), i = document.createElement("i");
    i.className = !b.key ? "" : b.wait_s ? "wait" : "on";
    c.title = !b.key ? "anahtar yok" : b.wait_s ? `kota doldu · ${Math.ceil(b.wait_s / 60)} dk` : "hazır";
    c.append(i, b.name === "yerel" ? "Yerel model" : b.name[0].toUpperCase() + b.name.slice(1)); bs.appendChild(c);
  }
  $("usage").textContent = `Bugün ${st.today} bulut isteği` + (st.cap ? ` / ${st.cap} (dolunca yalnız yerel model; ücretsiz katman, para çekilmez)` : "");
  $("key").placeholder = st.gemini ? "Kayıtlı ✓ — değiştirmek için yapıştır" : "AIza… yapıştır";
  banner(!st.gemini);
}
function playing(o) {
  document.querySelectorAll(".opt.playing").forEach(x => x.classList.remove("playing"));
  o.classList.add("playing"); clearTimeout(playing.t); playing.t = setTimeout(() => o.classList.remove("playing"), 3500);
}
async function saveKey() {
  const k = $("key").value.trim(); if (!k) return;
  $("keynote").textContent = "Deneniyor…";
  const r = await api("set_key", k);
  $("keynote").textContent = r === "ok" ? "Gemini bağlandı. Artık daha hızlı ve ekranı görebiliyorum." : r;
  $("key").value = ""; renderSettings(await api("settings"));
}
function banner(show) {
  $("banner")?.remove();
  if (!show) return;
  const b = el("banner"); b.id = "banner";
  b.innerHTML = '<b>⚡</b><span>Gemini anahtarı yok, yavaş yerel model çalışıyor.</span><span class="go">Ekle</span>';
  b.onclick = () => toggleSettings(true);
  feed.prepend(b);
}
document.querySelectorAll(".sug").forEach(b => b.onclick = () => { api("send", b.textContent); });

inp.addEventListener("input", () => $("send").classList.toggle("show", !!inp.value.trim()));
inp.addEventListener("keydown", e => { if (e.key === "Enter") send(); if (e.key === "Escape" && task) api("stop"); });
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (document.body.classList.contains("settings")) toggleSettings(false);
  else if (document.body.classList.contains("mini") && !task) api("hide");
});
document.addEventListener("keydown", e => { if (document.activeElement?.tagName !== "INPUT" && e.key.length === 1 && !e.metaKey) inp.focus(); });

window.addEventListener("pywebviewready", async () => {
  const h = await api("hello");
  speak = !h.speak; toggleSpeak(); hotkey = h.hotkey; machines(h.machines);
  if (h.voice) { $("mic").title = h.voice; }
  hint(); inp.focus();
  const st = await api("settings"); banner(!st.gemini);
});
$("spk").innerHTML = SPK_ON;
{ const h = new Date().getHours(); $("greet").textContent = h < 6 ? "İyi geceler" : h < 12 ? "Günaydın" : h < 18 ? "İyi günler" : "İyi akşamlar"; }
</script>
</body>
</html>
